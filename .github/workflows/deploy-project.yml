name: Deploy Project

on:
  push:
    branches: [ "production" ]
    paths:
      - 'lambdas/**'
      - 'cdk-project/**'

jobs:
  deploy:
    name: CDK Deploy (Project)
    runs-on: ubuntu-latest
    environment: "aws-deploy"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install AWS CDK
      run: npm install -g aws-cdk

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install CDK Python dependencies
      working-directory: ./cdk-project
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy CDK Stack (Hotswap)
      working-directory: ./cdk-project
      run: cdk deploy --all --require-approval never --hotswap
      # L'opzione --hotswap è ideale per deployare rapidamente solo il codice Lambda
      # saltando gli aggiornamenti di CloudFormation se l'infrastruttura non è cambiata.
